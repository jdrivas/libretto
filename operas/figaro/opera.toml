[opera]
title = "Le nozze di Figaro"
composer = "Wolfgang Amadeus Mozart"
librettist = "Lorenzo Da Ponte"
language = "it"
translation_language = "en"

[score]
edition = "Bärenreiter BA 4565"
# The user's licensed copy: read only, never shared, never committed.
pdf = "/Users/jdr/Dropbox/Development/rust/libretto-scratch/Barenreiter/Mozart,W+A+Le+nozze+di+KV+492+(KV,U).pdf"
first_music_page = 22          # PDF page of printed page 1
contents_pages = [13, 21]      # PDF pages of the "Verzeichnis der Szenen und Nummern"

# Recordings. id is the interchange file's name; album_title and artist are what roon-rd
# matches against (from the experiment's interchange files). sources are read only.
[[recording]]
id = "georg-solti-1981"
album_title = "Mozart: Le Nozze di Figaro"
artist = "Georg Solti / London Philharmonic Orchestra and Chorus"
conductor = "Georg Solti"
orchestra = "London Philharmonic Orchestra and Chorus"
year = 1981
label = "Decca"
store = "Qobuz"
# Part of the "Solti - Mozart - The Operas" box: Figaro is CDs 9-11.
sources = [
    "~/Dropbox/Audio/Qobuz/Sir Georg Solti/Solti - Mozart - The Operas/CD 09",
    "~/Dropbox/Audio/Qobuz/Sir Georg Solti/Solti - Mozart - The Operas/CD 10",
    "~/Dropbox/Audio/Qobuz/Sir Georg Solti/Solti - Mozart - The Operas/CD 11",
]
match = "nozze di Figaro"

[[recording]]
id = "currentzis-2014"
album_title = "Mozart: Le nozze di Figaro, K. 492"
artist = "Teodor Currentzis / MusicAeterna"
conductor = "Teodor Currentzis"
orchestra = "MusicAeterna"
year = 2014
label = "Sony Classical"
store = "HDTracks"
sources = ["~/Dropbox/Audio/HDTracks/Teodor Currentzis/Mozart  Le nozze di Figaro, K  492 [192kHz · 24bit]"]
match = "nozze di Figaro"

# Characters, in cast-list order, with the names and abbreviations the score uses for
# them: full names on a piece's first system, abbreviations on later systems, and
# speaker cues above shared staves. Matching ignores case and full stops.
